        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Skills]
      summary: Update a skill (HR)
      description: Send only the fields that change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillUpdate' }
      responses:
        '200':
          description: The updated skill.
          content:
