openapi: 3.1.0

info:
  title: Yousra ERP API
  version: 1.0.0
  description: |
    Backend API for the Yousra ERP: HR (employees and their family, contacts,
    diplomas, skills, positions and contracts), authentication, user accounts and the
    company structure (companies and departments).

    ## Authentication
    1. Call `POST /auth/login` with `{ username, password }`.
    2. The response body is the JWT itself, as a plain JSON string (not an object).
    3. Send it on every other request as `Authorization: Bearer <token>`.
    4. The token lasts 7 days. There is no refresh endpoint yet, so log in again when you get a 401.

    ## Who can call what
    - Every route except `/auth/login` needs a token.
    - Any logged-in user can call GET routes.
    - POST, PATCH and DELETE under `/hr` and `/company` need the `HR` role, or you get a 403.
    - `/admin/users` needs the `Admin` or `HR` role for every method.

    ## Responses
    - No envelope. A successful call returns the record (or array) directly. The few
      exceptions are described on their operations.
    - Errors are always `{ "message": "..." }`. Validation errors (400) also carry
      `error`, an object mapping each bad field to a list of messages.

    ## Dates
    - Send dates as `"YYYY-MM-DD"` strings (full ISO date-times also work).
    - Dates come back as ISO date-times, for example `"2024-08-15T00:00:00.000Z"`.

    ## Ids generated by the backend (never send them)
    - Employee matricule: `EMP-<hire year>-<hire month>-<number>`, e.g. `EMP-2024-08-001`.
      The number follows the order employees are created in.
    - Records that belong to an employee get the employee matricule plus a letter and a number:
      spouse `-S1`, child `-C1`, parent `-P1`, emergency contact `-EC1`,
      academic credential `-AC1`, contract `-CT1`. Example: `EMP-2024-08-001-S1`.
    - Everything else (users, companies, departments, positions, skills, assignments) uses a UUID.

    ## Behaviours worth knowing
    - Archived employees are hidden from `GET /hr/employees` and `GET /hr/employees/{matricule}`.
      Use the `/archived` routes to see them.
    - An employee has no login at first. Create a user in `/admin/users`, then attach it with
      `POST /hr/employees/{matricule}/link-user`.
    - A user that is linked to an employee can't be deleted (409). Unlink it first.
    - Adding a spouse sets the employee's `maritalStatus` to `MARRIED`. A MONOGAMOUS employee
      with an active spouse can't get a second one (409).
    - Because the employee field is named `MarriageRegime` (capital M) in request bodies, the same
      value comes back as `marriageRegime` (lowercase) in responses.

servers:
  - url: http://localhost:5000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
    description: Login accounts. Admin and HR only.
  - name: Employees
  - name: Spouses
  - name: Children
  - name: Parents
  - name: Emergency contacts
  - name: Academic credentials
  - name: Employee skills
  - name: Employee positions
    description: Assignments of an employee to a position.
  - name: Employee contracts
  - name: Positions
  - name: Skills
    description: The skill catalog used by employees and positions.
  - name: Contracts
    description: Read-only views across all employees.
  - name: Companies
  - name: Departments

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: awa.ngono, password: password123 }
      responses:
        '200':
          description: The JWT, as a plain JSON string.
          content:
            application/json:
              schema: { type: string }
              example: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiJFTVAtMjAyNC0wOC0wMDEiLCJyb2xlIjoiSFIifQ.signature
        '400':
          description: Bad body, or wrong password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { message: Incorrect Matricule or Password }
        '404':
          description: Unknown username.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Incorrect Username or Password }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the logged-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Password updated }
        '400':
          description: Bad body, or the current password is wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { message: Current password is incorrect }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── Users ─────────────────────────────
  /admin/users:
    post:
      tags: [Users]
      summary: Create a user (Admin, HR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created. The password is never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Users]
      summary: List users (Admin, HR)
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/userId'
    get:
      tags: [Users]
      summary: Get a user (Admin, HR)
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Users]
      summary: Update a user (Admin, HR)
      description: Send only the fields that change. A new password is hashed before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
            example: { role: HR }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Delete a user (Admin, HR)
      description: Refused with 409 while the user is linked to an employee.
      responses:
        '200':
          description: The deleted user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The user is linked to an employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: 'User is linked to employee EMP-2024-08-001, unlink them first with DELETE /api/v1/hr/employees/EMP-2024-08-001/link-user' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── Employees ─────────────────────────────
  /hr/employees:
    post:
      tags: [Employees]
      summary: Create an employee (HR)
      description: The matricule is generated from `hireDate`. No user account is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Employees]
      summary: List active (not archived) employees
      responses:
        '200':
          description: Active employees.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/archived:
    get:
      tags: [Employees]
      summary: List archived employees
      responses:
        '200':
          description: Archived employees.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/archived/{matricule}:
    parameters:
      - $ref: '#/components/parameters/matricule'
    get:
      tags: [Employees]
      summary: Get an archived employee
      responses:
        '200':
          description: The archived employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}:
    parameters:
      - $ref: '#/components/parameters/matricule'
    get:
      tags: [Employees]
      summary: Get an active employee
      responses:
        '200':
          description: The employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown or archived employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Employees]
      summary: Update an employee (HR)
      description: Send only the fields that change. The matricule, `niuNumber` and `cnpsNumber` can't be changed here; they are ignored if sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
            example: { phone: '+237699999999', MarriageRegime: POLYGAMOUS }
      responses:
        '200':
          description: The updated employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/archive:
    parameters:
      - $ref: '#/components/parameters/matricule'
    post:
      tags: [Employees]
      summary: Archive an employee (HR)
      description: Sets `isArchived` to true and `departureDate` to `effectiveDate`. Nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithMessage' }
              example: { message: Employee was archived, employee: { employeeMatricule: EMP-2024-08-001, isArchived: true } }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/restore:
    parameters:
      - $ref: '#/components/parameters/matricule'
    post:
      tags: [Employees]
      summary: Restore an archived employee (HR)
      description: No body. Clears `isArchived` and `departureDate`.
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeWithMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Also returned when the employee is not archived or does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /hr/employees/{matricule}/link-user:
    parameters:
      - $ref: '#/components/parameters/matricule'
    post:
      tags: [Employees]
      summary: Attach a login account to an employee (HR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkUserRequest' }
      responses:
        '200':
          description: The employee, now with `userId` set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Employee not found, or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409':
          description: The employee already has a user, or the user is already linked to another employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Employees]
      summary: Detach the login account from an employee (HR)
      description: No body. The user account itself is kept.
      responses:
        '200':
          description: The employee, with `userId` set to null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── Spouses ─────────────────────────────
  /hr/employees/{matricule}/spouses:
    parameters:
      - $ref: '#/components/parameters/matricule'
    get:
      tags: [Spouses]
      summary: List an employee's spouses (current and past)
      responses:
        '200':
          description: Spouses.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Spouse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Spouses]
      summary: Add a spouse (HR)
      description: Generates `spouseMatricule` (e.g. `EMP-2024-08-001-S1`) and sets the employee to MARRIED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpouseCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spouse' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The employee is MONOGAMOUS and already has an active spouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Employee is monogamous and already has a spouse }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/spouses/{spouseMatricule}:
    parameters:
      - $ref: '#/components/parameters/matricule'
      - $ref: '#/components/parameters/spouseMatricule'
    get:
      tags: [Spouses]
      summary: Get a spouse
      description: |
        Returns the **employee** with a `spouses` array holding only the requested spouse.
        Read `response.spouses[0]`. The array is empty if the spouse does not exist.
      responses:
        '200':
          description: Employee with the matching spouse.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Employee'
                  - type: object
                    properties:
                      spouses: { type: array, items: { $ref: '#/components/schemas/Spouse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Spouses]
      summary: Update a spouse (HR)
      description: Not partial. Send every field listed as required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpouseUpdate' }
      responses:
        '200':
          description: The updated spouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spouse' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/spouses/{spouseMatricule}/end:
    parameters:
      - $ref: '#/components/parameters/matricule'
      - $ref: '#/components/parameters/spouseMatricule'
    post:
      tags: [Spouses]
      summary: End a marriage (HR)
      description: Sets `isActive` to false and records the end date and reason. The spouse record is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndMarriageRequest' }
      responses:
        '200':
          description: The updated spouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spouse' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── Children ─────────────────────────────
  /hr/employees/{matricule}/children:
    parameters:
      - $ref: '#/components/parameters/matricule'
    get:
      tags: [Children]
      summary: List an employee's children
      description: |
        Wrapped response: the list is at `response.babies.children`.
        `babies` is null when the employee does not exist or is archived.
      responses:
        '200':
          description: Children.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Found Children }
                  babies:
                    type: [object, 'null']
                    properties:
                      children: { type: array, items: { $ref: '#/components/schemas/Child' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Children]
      summary: Add a child (HR)
      description: Generates `childMatricule` (e.g. `EMP-2024-08-001-C1`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/children/{childMatricule}:
    parameters:
      - $ref: '#/components/parameters/matricule'
      - $ref: '#/components/parameters/childMatricule'
    get:
      tags: [Children]
      summary: Get a child
      responses:
        '200':
          description: The child.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Children]
      summary: Update a child (HR)
      description: Send only the fields that change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildUpdate' }
      responses:
        '200':
          description: The updated child.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Children]
      summary: Delete a child (HR)
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────────── Parents ─────────────────────────────
  /hr/employees/{matricule}/parents:
    parameters:
      - $ref: '#/components/parameters/matricule'
    get:
      tags: [Parents]
      summary: List an employee's parents
      description: |
        Wrapped response: the list is at `response.parents`.
        The body is `null` when the employee does not exist or is archived.
      responses:
        '200':
          description: Parents.
          content:
            application/json:
              schema:
                type: [object, 'null']
                properties:
                  parents: { type: array, items: { $ref: '#/components/schemas/Parent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Parents]
      summary: Add a parent (HR)
      description: Generates `parentMatricule` (e.g. `EMP-2024-08-001-P1`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parent' }
        '400': { $ref: '#/components/responses/BadSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /hr/employees/{matricule}/parents/{parentMatricule}:
    parameters:
      - $ref: '#/components/parameters/matricule'
      - $ref: '#/components/parameters/parentMatricule'
    get:
      tags: [Parents]
      summary: Get a parent
      responses:
        '200':
          description: The parent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Parents]
      summary: Update a parent (HR)
      description: Send only the fields that change.
      requestBody:
