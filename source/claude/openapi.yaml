    get:
      tags: [Departments]
      summary: List sub-departments
      responses:
        '200':
          description: Departments whose parent is this one.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Department' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    matricule:
      name: matricule
      in: path
      required: true
      description: Employee matricule.
      schema: { type: string, example: EMP-2024-08-001 }
    spouseMatricule:
      name: spouseMatricule
      in: path
      required: true
      schema: { type: string, example: EMP-2024-08-001-S1 }
    childMatricule:
      name: childMatricule
      in: path
      required: true
      schema: { type: string, example: EMP-2024-08-001-C1 }
    parentMatricule:
      name: parentMatricule
      in: path
      required: true
      schema: { type: string, example: EMP-2024-08-001-P1 }
    contactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, example: EMP-2024-08-001-EC1 }
    credentialId:
      name: credentialId
      in: path
      required: true
      description: Academic credential id.
      schema: { type: string, example: EMP-2024-08-001-AC1 }
    contractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, example: EMP-2024-08-001-CT1 }
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    skillId:
      name: skillId
      in: path
      required: true
      description: Id of a skill from the catalog.
      schema: { type: string, format: uuid }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    departmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadSchema:
      description: The body failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example: { message: Bad Schema, error: { firstName: ['First name is required'] } }
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Invalid or expired token }
    Forbidden:
      description: Logged in, but the role is not allowed (writes need HR).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Not authorized }
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Resource not found }
    ServerError:
      description: |
        Unexpected or database error. Updating or deleting a record that does not exist also
        ends here instead of 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Internal server error }

  schemas:
    # ── Shared ──
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ValidationError:
      type: object
      required: [message]
      properties:
        message: { type: string, example: Bad Schema }
        error:
          type: object
          description: Field name → list of error messages.
          additionalProperties: { type: array, items: { type: string } }

    # ── Enums ──
    Role:
      type: string
      enum: [Admin, Manager, Developer, Cashier, Driver, HR, Finance, Waiter, Technician, Legal, Stock_Manager, Chef, Controller, Employee, Customer]
    Gender:
      type: string
      enum: [male, female]
    MaritalStatus:
      type: string
      enum: [SINGLE, MARRIED, DIVORCED, WIDOWED]
    MarriageRegime:
      type: string
      enum: [MONOGAMOUS, POLYGAMOUS]
    SpouseEndReason:
      type: string
      enum: [divorce, death]
    Relationship:
      type: string
      enum: [MOTHER, FATHER, SIBLING, SPOUSE, FRIEND, OTHER]
    SkillCategory:
      type: string
      enum: [TECHNICAL, LANGUAGE, SOFT_SKILL, DOMAIN]
    ProficiencyLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
    AssignmentType:
      type: string
      enum: [PRIMARY, ACTING, INTERIM, SECONDMENT]
    ContractType:
      type: string
      enum: [CDI, CDD, STAGE, TEMPORAIRE, APPRENTISSAGE]
    TerminationReason:
      type: string
      enum: [END_OF_TERM, RESIGNATION, DISMISSAL_FAULT, DISMISSAL_ECONOMIC, MUTUAL_AGREEMENT, DEATH, RETIREMENT]

    # ── Auth ──
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 8 }
        newPassword: { type: string, minLength: 8 }

    # ── Users ──
    User:
      type: object
      properties:
        Id: { type: string, format: uuid, description: 'Capital I.' }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
    UserCreate:
      type: object
      required: [username, firstName, lastName, role, password]
      properties:
        username: { type: string, minLength: 1, example: awa.ngono }
        firstName: { type: string, example: Awa }
        lastName: { type: string, example: Ngono }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 8, example: password123 }
    UserUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        username: { type: string, minLength: 1 }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, minLength: 8 }

    # ── Employees ──
    Employee:
      type: object
      properties:
        employeeMatricule: { type: string, example: EMP-2024-08-001 }
        userId: { type: [string, 'null'], format: uuid, description: Linked login account, null until HR links one. }
        firstName: { type: string }
        middleName: { type: [string, 'null'] }
        lastName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        dateOfBirth: { type: string, format: date-time }
        hireDate: { type: string, format: date-time }
        departureDate: { type: [string, 'null'], format: date-time }
        country: { type: string }
        niuNumber: { type: [string, 'null'] }
        cnpsNumber: { type: [string, 'null'] }
        maritalStatus: { $ref: '#/components/schemas/MaritalStatus' }
        marriageRegime:
          description: Lowercase m in responses.
          oneOf:
            - $ref: '#/components/schemas/MarriageRegime'
            - type: 'null'
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        residenceAddressLine: { type: [string, 'null'] }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeeCreate:
      type: object
      required: [firstName, lastName, gender, dateOfBirth, hireDate, country, maritalStatus, MarriageRegime, phone, email, residenceAddressLine]
      properties:
        firstName: { type: string, minLength: 1, example: Awa }
        middleName: { type: string }
        lastName: { type: string, example: Ngono }
        gender: { $ref: '#/components/schemas/Gender' }
        dateOfBirth: { type: string, format: date, example: '1990-01-01' }
        hireDate: { type: string, format: date, example: '2024-08-15', description: Year and month go into the matricule. }
        country: { type: string, example: Cameroon }
        niuNumber: { type: string }
        cnpsNumber: { type: string }
        maritalStatus: { $ref: '#/components/schemas/MaritalStatus' }
        MarriageRegime:
          description: Capital M in request bodies.
          allOf: [{ $ref: '#/components/schemas/MarriageRegime' }]
        phone: { type: string, example: '+237655555555' }
        email: { type: string, format: email, example: awa.ngono@example.com }
        residenceAddressLine: { type: string, minLength: 1, example: Douala }
    EmployeeUpdate:
      type: object
      description: Any subset of these fields.
      properties:
        firstName: { type: string, minLength: 1 }
        middleName: { type: string }
        lastName: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        dateOfBirth: { type: string, format: date }
        hireDate: { type: string, format: date, description: Does not change the existing matricule. }
        country: { type: string }
        maritalStatus: { $ref: '#/components/schemas/MaritalStatus' }
        MarriageRegime: { $ref: '#/components/schemas/MarriageRegime' }
        phone: { type: string }
        email: { type: string, format: email }
        residenceAddressLine: { type: string, minLength: 1 }
    EmployeeWithMessage:
      type: object
      properties:
        message: { type: string }
        employee: { $ref: '#/components/schemas/Employee' }
    ArchiveRequest:
      type: object
      required: [terminationReason, effectiveDate]
      properties:
        terminationReason: { type: string, description: Free text for now, it is not stored., example: RESIGNATION }
        effectiveDate: { type: string, format: date, description: Saved as the departure date., example: '2026-01-31' }
    LinkUserRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid, description: '`Id` of the user from /admin/users.' }

    # ── Spouses ──
    Spouse:
      type: object
      properties:
        spouseMatricule: { type: string, example: EMP-2024-08-001-S1 }
        employeeMatricule: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date-time }
        gender: { $ref: '#/components/schemas/Gender' }
        cniNumber: { type: [string, 'null'] }
        marriageDate: { type: string, format: date-time }
        marriageCertificateNo: { type: [string, 'null'] }
        isDependent: { type: boolean }
        isActive: { type: boolean, description: False once the marriage has ended. }
        endedOn: { type: [string, 'null'], format: date-time }
        endReason:
          oneOf:
            - $ref: '#/components/schemas/SpouseEndReason'
            - type: 'null'
    SpouseCreate:
      type: object
      required: [firstName, lastName, dateOfBirth, gender, cniNumber, marriageDate, isDependent, employeeMatricule]
      properties:
        firstName: { type: string, minLength: 1, example: Marie }
        lastName: { type: string, minLength: 1, example: Ngono }
        dateOfBirth: { type: string, format: date, example: '1992-05-10' }
        gender: { $ref: '#/components/schemas/Gender' }
        cniNumber: { type: string, minLength: 1, description: Must be unique., example: CNI-123456 }
        marriageDate: { type: string, format: date, example: '2015-06-20' }
        marriageCertificateNo: { type: string }
        isDependent: { type: boolean }
        employeeMatricule: { type: string, minLength: 1, description: Same matricule as in the URL., example: EMP-2024-08-001 }
    SpouseUpdate:
      type: object
      description: Not partial. `cniNumber` can't be changed.
      required: [firstName, lastName, dateOfBirth, gender, marriageDate, isDependent]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        dateOfBirth: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        marriageDate: { type: string, format: date }
        marriageCertificateNo: { type: string }
        isDependent: { type: boolean }
    EndMarriageRequest:
      type: object
      required: [endedOn, endReason]
      properties:
        endedOn: { type: string, format: date, example: '2026-01-31' }
        endReason: { $ref: '#/components/schemas/SpouseEndReason' }

    # ── Children ──
    Child:
      type: object
      properties:
        childMatricule: { type: string, example: EMP-2024-08-001-C1 }
        employeeMatricule: { type: string }
        spouseMatricule: { type: [string, 'null'], description: The other parent, if they are a recorded spouse. }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date-time }
        isDependent: { type: boolean }
        gender: { $ref: '#/components/schemas/Gender' }
        birthCertificateNo: { type: [string, 'null'] }
    ChildCreate:
      type: object
      required: [isDependent, birthCertificateNo, firstName, lastName, spouseMatricule, employeeMatricule, dateOfBirth, gender]
      properties:
        firstName: { type: string, example: Junior }
        lastName: { type: string, example: Ngono }
        dateOfBirth: { type: string, format: date, example: '2018-03-15' }
        gender: { $ref: '#/components/schemas/Gender' }
        isDependent: { type: boolean }
        birthCertificateNo: { type: string, example: BC-001 }
        spouseMatricule: { type: string, description: An existing spouse of this employee., example: EMP-2024-08-001-S1 }
        employeeMatricule: { type: string, description: Same matricule as in the URL., example: EMP-2024-08-001 }
    ChildUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        isDependent: { type: boolean }
        birthCertificateNo: { type: string }
        spouseMatricule: { type: string }

    # ── Parents ──
    Parent:
      type: object
      properties:
        parentMatricule: { type: string, example: EMP-2024-08-001-P1 }
        employeeMatricule: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        isAlive: { type: boolean }
        dateOfBirth: { type: [string, 'null'], format: date-time }
        gender: { $ref: '#/components/schemas/Gender' }
        isDependent: { type: boolean }
    ParentCreate:
      type: object
      required: [firstName, lastName, isAlive, dateOfBirth, gender, isDependent]
      properties:
        firstName: { type: string, example: Paul }
        lastName: { type: string, example: Ngono }
        isAlive: { type: boolean }
        dateOfBirth: { type: [string, 'null'], format: date, description: Required key; send null if unknown., example: '1960-01-01' }
        gender: { $ref: '#/components/schemas/Gender' }
        isDependent: { type: boolean }
    ParentUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        firstName: { type: string }
        lastName: { type: string }
        isAlive: { type: boolean }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        isDependent: { type: boolean }

    # ── Emergency contacts ──
    EmergencyContact:
      type: object
      properties:
        contactId: { type: string, example: EMP-2024-08-001-EC1 }
        employeeMatricule: { type: string }
        firstName: { type: string }
        middleName: { type: [string, 'null'] }
        lastName: { type: string }
        relationship: { $ref: '#/components/schemas/Relationship' }
        phone: { type: string }
        alternatePhone: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        priorityOrder: { type: integer }
        isActive: { type: boolean }
    EmergencyContactCreate:
      type: object
      required: [firstName, lastName, relationship, phone, priorityOrder, isActive]
      properties:
        firstName: { type: string, example: Alice }
        middleName: { type: [string, 'null'] }
        lastName: { type: string, example: Mballa }
        relationship: { $ref: '#/components/schemas/Relationship' }
        phone: { type: string, description: E.164 format, + and digits only., example: '+237655555555' }
        alternatePhone: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        priorityOrder: { type: integer, description: 1 is called first., example: 1 }
        isActive: { type: boolean }
    EmergencyContactUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        firstName: { type: string }
        middleName: { type: [string, 'null'] }
        lastName: { type: string }
        relationship: { $ref: '#/components/schemas/Relationship' }
        phone: { type: string, description: E.164 format. }
        alternatePhone: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        priorityOrder: { type: integer }
        isActive: { type: boolean }

    # ── Academic credentials ──
    AcademicCredential:
      type: object
      properties:
        id: { type: string, example: EMP-2024-08-001-AC1 }
        employeeMatricule: { type: string }
        degreeName: { type: string }
        institutionAttended: { type: string }
        fieldOfStudy: { type: string }
        startDate: { type: string, format: date-time }
        completionDate: { type: [string, 'null'], format: date-time }
        gradeEarned: { type: integer }
        gradeScale: { type: integer }
        gradePercentage: { type: [integer, 'null'] }
        gradeLetter: { type: [string, 'null'] }
        diplomaNumber: { type: [string, 'null'] }
        issueDate: { type: string, format: date-time }
    AcademicCredentialCreate:
      type: object
      required: [employeeMatricule, degreeName, institutionAttended, fieldOfStudy, startDate, gradeEarned, gradeScale, issueDate]
      properties:
        employeeMatricule: { type: string, minLength: 1, description: Same matricule as in the URL., example: EMP-2024-08-001 }
        degreeName: { type: string, minLength: 1, example: BSc Accounting }
        institutionAttended: { type: string, minLength: 1, example: University of Douala }
        fieldOfStudy: { type: string, minLength: 1, example: Accounting }
        startDate: { type: string, format: date, example: '2010-09-01' }
        completionDate: { type: [string, 'null'], format: date, example: '2013-06-30' }
        gradeEarned: { type: integer, example: 15 }
        gradeScale: { type: integer, example: 20 }
        gradePercentage: { type: [integer, 'null'] }
        gradeLetter: { type: [string, 'null'] }
        diplomaNumber: { type: [string, 'null'] }
        issueDate: { type: string, format: date, example: '2013-07-15' }
    AcademicCredentialUpdate:
      type: object
      description: Not partial. Same as create, without `employeeMatricule`.
      required: [degreeName, institutionAttended, fieldOfStudy, startDate, gradeEarned, gradeScale, issueDate]
      properties:
        degreeName: { type: string, minLength: 1 }
        institutionAttended: { type: string, minLength: 1 }
        fieldOfStudy: { type: string, minLength: 1 }
        startDate: { type: string, format: date }
        completionDate: { type: [string, 'null'], format: date }
        gradeEarned: { type: integer }
        gradeScale: { type: integer }
        gradePercentage: { type: [integer, 'null'] }
        gradeLetter: { type: [string, 'null'] }
        diplomaNumber: { type: [string, 'null'] }
        issueDate: { type: string, format: date }

    # ── Employee skills ──
    EmployeeSkill:
      type: object
      properties:
        employeeMatricule: { type: string }
        skillId: { type: string, format: uuid }
        proficiencyLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        acquiredDate: { type: [string, 'null'], format: date-time }
        lastAssessedDate: { type: [string, 'null'], format: date-time }
    EmployeeSkillCreate:
      type: object
      required: [employeeMatricule, skillId, proficiencyLevel]
      properties:
        employeeMatricule: { type: string, minLength: 1, description: Same matricule as in the URL. }
        skillId: { type: string, format: uuid }
        proficiencyLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        acquiredDate: { type: [string, 'null'], format: date }
        lastAssessedDate: { type: [string, 'null'], format: date }
    EmployeeSkillUpdate:
      type: object
      required: [proficiencyLevel]
      properties:
        proficiencyLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        acquiredDate: { type: [string, 'null'], format: date }
        lastAssessedDate: { type: [string, 'null'], format: date }

    # ── Assignments ──
    Assignment:
      type: object
      properties:
        assignmentId: { type: string, format: uuid }
        employeeMatricule: { type: string }
        positionId: { type: string, format: uuid }
        assignmentType: { $ref: '#/components/schemas/AssignmentType' }
        startDate: { type: string, format: date-time }
        endDate: { type: [string, 'null'], format: date-time, description: Null while the assignment is active. }
        notes: { type: [string, 'null'] }
    AssignmentCreate:
      type: object
      required: [employeeMatricule, positionId, assignmentType, startDate]
      properties:
        employeeMatricule: { type: string, minLength: 1, description: Same matricule as in the URL. }
        positionId: { type: string, format: uuid }
        assignmentType: { $ref: '#/components/schemas/AssignmentType' }
        startDate: { type: string, format: date, example: '2024-08-15' }
        endDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
    AssignmentUpdate:
      type: object
      description: The position can't be changed; end the assignment and create a new one instead.
      required: [assignmentType, startDate]
      properties:
        assignmentType: { $ref: '#/components/schemas/AssignmentType' }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }

    # ── Contracts ──
    Contract:
      type: object
      properties:
        contractId: { type: string, example: EMP-2024-08-001-CT1, description: Older contracts may still have a UUID. }
        employeeMatricule: { type: string }
        contractType: { $ref: '#/components/schemas/ContractType' }
        signedDate: { type: string, format: date-time }
        startDate: { type: string, format: date-time }
        endDate: { type: [string, 'null'], format: date-time }
        trialEndDate: { type: [string, 'null'], format: date-time }
        baseSalaryAtSigning: { type: integer }
        positionId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid, description: A department id. }
        terminationDate: { type: [string, 'null'], format: date-time }
        terminationReason:
          oneOf:
            - $ref: '#/components/schemas/TerminationReason'
            - type: 'null'
        documentReference: { type: [string, 'null'] }
    ContractCreate:
      type: object
      required: [contractType, signedDate, startDate, baseSalaryAtSigning, positionId, serviceId]
      properties:
        contractType: { $ref: '#/components/schemas/ContractType' }
        signedDate: { type: string, format: date, example: '2024-01-01' }
        startDate: { type: string, format: date, example: '2024-01-15' }
        endDate: { type: [string, 'null'], format: date }
        trialEndDate: { type: [string, 'null'], format: date }
        baseSalaryAtSigning: { type: integer, minimum: 0, example: 350000 }
        positionId: { type: string, format: uuid }
        serviceId: { type: string, minLength: 1, description: A department id. }
        terminationDate: { type: [string, 'null'], format: date }
        terminationReason:
          oneOf:
            - $ref: '#/components/schemas/TerminationReason'
            - type: 'null'
        documentReference: { type: [string, 'null'] }
    ContractUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        contractType: { $ref: '#/components/schemas/ContractType' }
        signedDate: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        trialEndDate: { type: [string, 'null'], format: date }
        baseSalaryAtSigning: { type: integer, minimum: 0 }
        positionId: { type: string, format: uuid }
        serviceId: { type: string, minLength: 1 }
        terminationDate: { type: [string, 'null'], format: date }
        terminationReason:
          oneOf:
            - $ref: '#/components/schemas/TerminationReason'
            - type: 'null'
        documentReference: { type: [string, 'null'] }

    # ── Positions ──
    Position:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        functionDescription: { type: [string, 'null'] }
        supervisorId: { type: [string, 'null'], format: uuid, description: The position this one reports to. }
        departmentId: { type: string, format: uuid }
    PositionCreate:
      type: object
      required: [title, description, departmentId]
      properties:
        title: { type: string, minLength: 1, example: Accountant }
        description: { type: string }
        functionDescription: { type: [string, 'null'] }
        supervisorId: { type: [string, 'null'], format: uuid }
        departmentId: { type: string, minLength: 1 }
    PositionUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        functionDescription: { type: [string, 'null'] }
        supervisorId: { type: [string, 'null'], format: uuid }
        departmentId: { type: string, minLength: 1 }
    PositionSkill:
      type: object
      properties:
        positionId: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        requiredLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        isMandatory: { type: boolean }
    PositionSkillCreate:
      type: object
      required: [skillId, requiredLevel, isMandatory]
      properties:
        skillId: { type: string, minLength: 1 }
        requiredLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        isMandatory: { type: boolean }
    PositionSkillUpdate:
      type: object
      properties:
        requiredLevel: { $ref: '#/components/schemas/ProficiencyLevel' }
        isMandatory: { type: boolean }

    # ── Skills catalog ──
    Skill:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/SkillCategory' }
        description: { type: [string, 'null'] }
    SkillCreate:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, example: Excel }
        category: { $ref: '#/components/schemas/SkillCategory' }
        description: { type: [string, 'null'] }
    SkillUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        name: { type: string, minLength: 1 }
        category: { $ref: '#/components/schemas/SkillCategory' }
        description: { type: [string, 'null'] }

    # ── Companies ──
    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        creationDate: { type: string, format: date-time }
        isParent: { type: boolean }
        parentCompanyId: { type: [string, 'null'], format: uuid }
    CompanyCreate:
      type: object
      required: [name, creationDate, isParent]
      properties:
        name: { type: string, minLength: 1, example: Yousra Holding }
        creationDate: { type: string, format: date, example: '2010-01-01' }
        isParent: { type: boolean }
        parentCompanyId: { type: [string, 'null'], format: uuid }
    CompanyUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        name: { type: string, minLength: 1 }
        creationDate: { type: string, format: date }
        isParent: { type: boolean }
        parentCompanyId: { type: [string, 'null'], format: uuid }

    # ── Departments ──
    Department:
      type: object
      properties:
        departmentId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        parentDepartmentId: { type: [string, 'null'], format: uuid }
        description: { type: string }
        isActive: { type: boolean }
    DepartmentCreate:
      type: object
      required: [companyId, name, description, isActive]
      properties:
        companyId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, example: Finance }
        parentDepartmentId: { type: [string, 'null'], format: uuid }
        description: { type: string }
        isActive: { type: boolean }
    DepartmentUpdate:
      type: object
      description: Any subset of the create fields.
      properties:
        companyId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        parentDepartmentId: { type: [string, 'null'], format: uuid }
        description: { type: string }
        isActive: { type: boolean }
